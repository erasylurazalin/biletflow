# Runs the same checks CONTRIBUTING.md asks for before a pull request, on a clean machine.
# A clean machine is the point: it catches a package that is installed on your laptop
# but missing from package.json, which is exactly how PR #9 broke main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway Postgres for src/routes/orders.db.test.ts, which proves two buyers cannot
    # both get the last ticket. A faked pool never waits for a lock, so it cannot.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: biletflow
          POSTGRES_DB: biletflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biletflow -d biletflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://biletflow:biletflow@localhost:5432/biletflow_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci, never npm install: it fails if package.json and the lockfile disagree.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # Most tests fake the database. The ones in *.db.test.ts use the service above.
      - run: npm test

  # The frontend has its own package.json and lockfile, and the root ESLint and
  # Prettier configs skip web/, so it gets its own job.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # tsc needs the route types (LayoutProps and friends) that Next generates into
      # .next/types. On a clean checkout they do not exist yet, so generate them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      # The pages are force-dynamic, so the build does not call the API.
      - run: npm run build
